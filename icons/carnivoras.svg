<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Gradiente de la hoja exterior (Punta Verde a Base Rosa) -->
    <linearGradient id="leaf-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7cb342"/>
      <stop offset="40%" stop-color="#9ccc65"/>
      <stop offset="75%" stop-color="#dcedc8"/>
      <stop offset="100%" stop-color="#f8bbd0"/>
    </linearGradient>

    <!-- Gradiente de la hoja interior (Más rosa) -->
    <linearGradient id="leaf-grad-inner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ec407a"/>
      <stop offset="50%" stop-color="#f48fb1"/>
      <stop offset="100%" stop-color="#fce4ec"/>
    </linearGradient>

    <!-- Patrón para simular la textura carnosa y el mucílago (gotitas) -->
    <pattern id="dew" x="0" y="0" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#ffffff" opacity="0.7"/>
      <circle cx="6" cy="3" r="0.5" fill="#ffffff" opacity="0.9"/>
      <circle cx="3" cy="6" r="0.7" fill="#ffffff" opacity="0.6"/>
      <circle cx="7" cy="7" r="1.1" fill="#ffffff" opacity="0.4"/>
      <circle cx="1" cy="8" r="0.4" fill="#ffffff" opacity="0.8"/>
    </pattern>

    <!-- Hoja Principal (Exterior) -->
    <g id="pinguicula-leaf">
      <path d="M 0,0 C -35,-20 -55,-90 0,-115 C 55,-90 35,-20 0,0 Z" fill="url(#leaf-grad)" />
      <path d="M 0,0 C -35,-20 -55,-90 0,-115 C 55,-90 35,-20 0,0 Z" fill="url(#dew)" opacity="0.75"/>
      <path d="M 0,0 C -35,-20 -55,-90 0,-115 C 55,-90 35,-20 0,0 Z" fill="none" stroke="#fafafaff" stroke-width="1.5" opacity="0.6"/>
    </g>

    <!-- Hoja Central (Interior) -->
    <g id="pinguicula-leaf-inner">
      <path d="M 0,0 C -30,-15 -45,-75 0,-95 C 45,-75 30,-15 0,0 Z" fill="url(#leaf-grad-inner)" />
      <path d="M 0,0 C -30,-15 -45,-75 0,-95 C 45,-75 30,-15 0,0 Z" fill="url(#dew)" opacity="0.65"/>
      <path d="M 0,0 C -30,-15 -45,-75 0,-95 C 45,-75 30,-15 0,0 Z" fill="none" stroke="#ffffffff" stroke-width="1" opacity="0.5"/>
    </g>
  </defs>

  <!-- ================= ROSETAS ================= -->

  <!-- CAPA 1: Hojas base (más grandes y extendidas) -->
  <use href="#pinguicula-leaf" transform="translate(400,400) rotate(0) scale(1.6)" />
  <use href="#pinguicula-leaf" transform="translate(400,400) rotate(45) scale(1.6)" />
  <use href="#pinguicula-leaf" transform="translate(400,400) rotate(90) scale(1.6)" />
  <use href="#pinguicula-leaf" transform="translate(400,400) rotate(135) scale(1.6)" />
  <use href="#pinguicula-leaf" transform="translate(400,400) rotate(180) scale(1.6)" />
  <use href="#pinguicula-leaf" transform="translate(400,400) rotate(225) scale(1.6)" />
  <use href="#pinguicula-leaf" transform="translate(400,400) rotate(270) scale(1.6)" />
  <use href="#pinguicula-leaf" transform="translate(400,400) rotate(315) scale(1.6)" />

  <!-- CAPA 2: Hojas intermedias -->
  <use href="#pinguicula-leaf" transform="translate(400,400) rotate(22.5) scale(1.3)" />
  <use href="#pinguicula-leaf" transform="translate(400,400) rotate(67.5) scale(1.3)" />
  <use href="#pinguicula-leaf" transform="translate(400,400) rotate(112.5) scale(1.3)" />
  <use href="#pinguicula-leaf" transform="translate(400,400) rotate(157.5) scale(1.3)" />
  <use href="#pinguicula-leaf" transform="translate(400,400) rotate(202.5) scale(1.3)" />
  <use href="#pinguicula-leaf" transform="translate(400,400) rotate(247.5) scale(1.3)" />
  <use href="#pinguicula-leaf" transform="translate(400,400) rotate(292.5) scale(1.3)" />
  <use href="#pinguicula-leaf" transform="translate(400,400) rotate(337.5) scale(1.3)" />

  <!-- CAPA 3: Hojas medias -->
  <use href="#pinguicula-leaf" transform="translate(400,400) rotate(10) scale(1.05)" />
  <use href="#pinguicula-leaf" transform="translate(400,400) rotate(55) scale(1.05)" />
  <use href="#pinguicula-leaf" transform="translate(400,400) rotate(100) scale(1.05)" />
  <use href="#pinguicula-leaf" transform="translate(400,400) rotate(145) scale(1.05)" />
  <use href="#pinguicula-leaf" transform="translate(400,400) rotate(190) scale(1.05)" />
  <use href="#pinguicula-leaf" transform="translate(400,400) rotate(235) scale(1.05)" />
  <use href="#pinguicula-leaf" transform="translate(400,400) rotate(280) scale(1.05)" />
  <use href="#pinguicula-leaf" transform="translate(400,400) rotate(325) scale(1.05)" />

  <!-- CAPA 4: Transición al centro (Uso del diseño interior más rosa) -->
  <use href="#pinguicula-leaf-inner" transform="translate(400,400) rotate(0) scale(0.8)" />
  <use href="#pinguicula-leaf-inner" transform="translate(400,400) rotate(60) scale(0.8)" />
  <use href="#pinguicula-leaf-inner" transform="translate(400,400) rotate(120) scale(0.8)" />
  <use href="#pinguicula-leaf-inner" transform="translate(400,400) rotate(180) scale(0.8)" />
  <use href="#pinguicula-leaf-inner" transform="translate(400,400) rotate(240) scale(0.8)" />
  <use href="#pinguicula-leaf-inner" transform="translate(400,400) rotate(300) scale(0.8)" />

  <!-- CAPA 5: Corona central -->
  <use href="#pinguicula-leaf-inner" transform="translate(400,400) rotate(30) scale(0.55)" />
  <use href="#pinguicula-leaf-inner" transform="translate(400,400) rotate(102) scale(0.55)" />
  <use href="#pinguicula-leaf-inner" transform="translate(400,400) rotate(174) scale(0.55)" />
  <use href="#pinguicula-leaf-inner" transform="translate(400,400) rotate(246) scale(0.55)" />
  <use href="#pinguicula-leaf-inner" transform="translate(400,400) rotate(318) scale(0.55)" />

  <!-- CAPA 6: Hojas nacientes (Núcleo) -->
  <use href="#pinguicula-leaf-inner" transform="translate(400,400) rotate(15) scale(0.35)" />
  <use href="#pinguicula-leaf-inner" transform="translate(400,400) rotate(135) scale(0.35)" />
  <use href="#pinguicula-leaf-inner" transform="translate(400,400) rotate(255) scale(0.35)" />
  
  <!-- Núcleo central cerrado -->
  <path d="M 400,400 C 390,395 385,380 400,375 C 415,380 410,395 400,400 Z" fill="#f84883ff" />
</svg>
